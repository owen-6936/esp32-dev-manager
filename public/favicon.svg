<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- CPU body -->
  <rect x="160" y="160" width="192" height="192" rx="24" fill="url(#chip)" opacity="0.95"/>
  <!-- Inner die -->
  <rect x="200" y="200" width="112" height="112" rx="12" fill="url(#bg)" opacity="0.8"/>
  <!-- Die detail circle -->
  <circle cx="256" cy="256" r="28" fill="none" stroke="white" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="256" r="12" fill="white" opacity="0.8"/>
  <!-- Pins - Top -->
  <rect x="200" y="128" width="16" height="40" rx="4" fill="url(#chip)" opacity="0.9"/>
  <rect x="232" y="128" width="16" height="40" rx="4" fill="url(#chip)" opacity="0.9"/>
  <rect x="264" y="128" width="16" height="40" rx="4" fill="url(#chip)" opacity="0.9"/>
  <rect x="296" y="128" width="16" height="40" rx="4" fill="url(#chip)" opacity="0.9"/>
  <!-- Pins - Bottom -->
  <rect x="200" y="344" width="16" height="40" rx="4" fill="url(#chip)" opacity="0.9"/>
  <rect x="232" y="344" width="16" height="40" rx="4" fill="url(#chip)" opacity="0.9"/>
  <rect x="264" y="344" width="16" height="40" rx="4" fill="url(#chip)" opacity="0.9"/>
  <rect x="296" y="344" width="16" height="40" rx="4" fill="url(#chip)" opacity="0.9"/>
  <!-- Pins - Left -->
  <rect x="128" y="200" width="40" height="16" rx="4" fill="url(#chip)" opacity="0.9"/>
  <rect x="128" y="232" width="40" height="16" rx="4" fill="url(#chip)" opacity="0.9"/>
  <rect x="128" y="264" width="40" height="16" rx="4" fill="url(#chip)" opacity="0.9"/>
  <rect x="128" y="296" width="40" height="16" rx="4" fill="url(#chip)" opacity="0.9"/>
  <!-- Pins - Right -->
  <rect x="344" y="200" width="40" height="16" rx="4" fill="url(#chip)" opacity="0.9"/>
  <rect x="344" y="232" width="40" height="16" rx="4" fill="url(#chip)" opacity="0.9"/>
  <rect x="344" y="264" width="40" height="16" rx="4" fill="url(#chip)" opacity="0.9"/>
  <rect x="344" y="296" width="40" height="16" rx="4" fill="url(#chip)" opacity="0.9"/>
</svg>
